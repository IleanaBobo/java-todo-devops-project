    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build started
        run: echo "Automatic build started"

      - name: Execute test build
        run: |
          echo "Running DevOps Gadgets test..."
          sleep 10
          echo "Build completed successfully"

      - name: Build result
        run: echo "SUCCESS - DevOps Gadgets Auto Test 2"
